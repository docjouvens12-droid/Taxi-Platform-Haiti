name:Remove Cash Payment
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-cash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove cash payment UI
        run: |
          sed -i '/className="payment-row"/d' app/page.tsx
          sed -i "/openPanel('payment')/d" app/page.tsx
          sed -i "/panel === 'payment' && <div className=\"panel-body\"/d" app/page.tsx

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app/page.tsx
          git commit -m "Remove cash payment from passenger UI" || exit 0
          git push origin main
