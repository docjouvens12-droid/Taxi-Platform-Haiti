<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f705a" />
  <title>MOVI Reset</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102033;background:#eef6f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#0f705a 0 22%,#eef6f2 22%)}
    main{width:min(100%,420px);background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 24px 70px rgba(8,34,27,.18);text-align:center}
    .mark{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#18a06f,#08794f);color:#fff;font-weight:950;font-size:36px;box-shadow:0 12px 28px rgba(11,132,88,.24)}
    h1{margin:0;font-size:29px;letter-spacing:-.03em}
    p{margin:10px 0 0;color:#65766f;line-height:1.5}
    #status{margin:22px 0 14px;padding:13px;border-radius:14px;background:#eef8f4;color:#0f705a;font-weight:800}
    button{width:100%;min-height:54px;border:0;border-radius:16px;background:#0f705a;color:#fff;font-size:16px;font-weight:900;box-shadow:0 10px 24px rgba(15,112,90,.2)}
    small{display:block;margin-top:14px;color:#8a9792;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>MOVI</h1>
    <p>N ap netwaye ansyen cache ak service worker ki te bloke aplikasyon an.</p>
    <div id="status">Netwayaj an kou…</div>
    <button id="open" type="button" disabled>Ouvri MOVI pwòp</button>
    <small>Ou ka bezwen konekte ankò apre netwayaj la.</small>
  </main>
  <script>
    (async function(){
      const status=document.getElementById('status');
      const button=document.getElementById('open');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        try{ localStorage.clear(); }catch(e){}
        try{ sessionStorage.clear(); }catch(e){}
        status.textContent='Netwayaj fini ✅';
      }catch(e){
        status.textContent='Netwayaj fèt an pati — ou ka kontinye.';
      }
      button.disabled=false;
      button.addEventListener('click',function(){
        location.replace('/movi-app-v2?clean=' + Date.now());
      });
    })();
  </script>
</body>
</html>
